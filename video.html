      <nav>
        <ul class="site-nav">
          <li><a href="index.html">Home</a></li>

        </ul>
      </nav>

  <main>

    <!-- Page Header -->
    <section class="page-hero">
      <div class="container">
        <p class="cap page-hero-cap">Video</p>
        <h1 class="en page-hero-title">Video</h1>
        <p class="jp page-hero-sub">演奏動画</p>
      </div>
    </section>

    <!-- Video Section -->
    <section class="video-section">
      <div class="container">

        <!--
          =====================================================
          ★ 動画の追加方法
          動画が増えたら <video-empty> を削除し、
          下の <ul class="video-grid"> のコメントを外して
          YouTube の動画IDを埋め込んでください。

          動画IDはYouTubeのURLの ?v= 以降の文字列です。
          例: https://www.youtube.com/watch?v=XXXXXXXXXXX
              → 動画ID は XXXXXXXXXXX

          <iframe> の src を
          https://www.youtube.com/embed/動画ID
          に書き換えてください。
          =====================================================
        -->

        <!-- 動画なしの場合 -->
        <div class="video-empty">
          <p class="jp video-empty-note">演奏動画はYouTubeチャンネルをご覧ください。</p>
          <a href="https://www.youtube.com/channel/UCRp1ciYvbqt11qqKlRjzUeg" class="btn btn-dark video-empty-btn" target="_blank" rel="noopener">YouTubeチャンネルへ →</a>
        </div>

        <!--
          ★ 動画が増えたらここのコメントを外してください

          <ul class="video-grid">
            <li class="video-item">
              <div class="video-embed">
                <iframe
                  src="https://www.youtube.com/embed/動画ID"
                  title="動画タイトル"
                  frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen
                  loading="lazy">
                </iframe>
              </div>
              <p class="jp video-title">動画タイトル</p>
              <p class="cap video-date">2024</p>
            </li>
          </ul>
        -->

      </div>
    </section>

  </main>
